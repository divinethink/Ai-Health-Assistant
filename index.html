<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Health Companion — পারিবারিক স্বাস্থ্য সহায়ক</title>
<meta name="theme-color" content="#0E4B43" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

<!-- Preconnect — DailyTask pattern reused -->
<link rel="preconnect" href="https://cdn.tailwindcss.com" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<!-- Hind Siliguri — Architecture Plan §10.6-এ Doctor Export ফন্ট হিসেবে Confirmed;
     সাধারণ UI-তেও একই বাংলা ফন্ট ব্যবহার করে visual-consistency রাখা হচ্ছে -->
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script>
  // cdn.tailwindcss.com-এর "production-এ ব্যবহার করবেন না" cosmetic warning suppress —
  // DailyTask app-এর প্রমাণিত pattern, আচরণ অপরিবর্তিত
  (function () {
    const _origWarn = console.warn;
    const SUPPRESSED_SUBSTRINGS = ["cdn.tailwindcss.com"];
    console.warn = function (...args) {
      const combined = args
        .map((a) => (typeof a === "string" ? a : (a && a.message) || ""))
        .join(" ");
      if (SUPPRESSED_SUBSTRINGS.some((s) => combined.includes(s))) return;
      _origWarn.apply(console, args);
    };
  })();
</script>
<script src="https://cdn.tailwindcss.com" defer></script>

<!-- Google Identity Services — Google Drive Backup OAuth token-client-এর জন্য
     (Architecture Plan Part C §8.3, src/legacy/googleDrive.js)। Firebase
     Google-linking থেকে সম্পূর্ণ আলাদা/independent mechanism। -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  /* বুট-স্প্ল্যাশ: JS লোডের আগেই দেখায়; React-এর BootSplash একই ক্লাস ব্যবহার করে (লাফ/ফ্ল্যাশ নেই) */
  html,body{margin:0;background:var(--hs-bg,#F1F6F2)}
  .hc-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--hs-bg,#F1F6F2);color:var(--hs-primary,#0E4B43);font-family:"Hind Siliguri",system-ui,sans-serif}
  .hc-splash img{width:72px;height:72px;border-radius:20px}
  .hc-splash b{font-size:20px}
  .hc-spin{width:26px;height:26px;border:3px solid var(--hs-border,#D9E5DE);border-top-color:var(--hs-primary,#0E4B43);border-radius:50%;animation:hcspin .8s linear infinite}
  @keyframes hcspin{to{transform:rotate(360deg)}}
</style>
<script>
  try{var th=localStorage.getItem("hs-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
</script>
<style>
  /* P11 Design Tokens (mockup §৬) — Light/Sepia/Dark, data-theme attribute-driven on
     <html>। Default (no attribute / data-theme="light") = আগের অপরিবর্তিত রং, তাই এই
     token-সেট যোগ হওয়া কোনো existing visual regression তৈরি করে না। আপাতত শুধু P11
     app-shell (TopBar/BottomNav/MenuPage) এই var()-গুলো ব্যবহার করে — বাকি existing
     page-content (HealthRecords/AIChat/Documents/Wellness-Blog ইত্যাদি) নিজস্ব hardcoded
     রং-এই থাকে (আলাদা, বড় retrofit — এখানে scope করা হয়নি)। */
  :root, html[data-theme="light"] {
    --theme-primary: #0E4B43;
    --hs-bg: #F1F6F2;
    --hs-surface: #FFFFFF;
    --hs-text: #1B2430;
    --hs-muted: #5F716C;
    --hs-primary: #0E4B43;
    --hs-primary-contrast: #FFFFFF;
    --hs-border: #D9E5DE;
    --hs-chip-bg: #E4F0E9;
    --hs-input-border: #C3D2CA; --hs-primary-2: #17705F; --hs-hero-1: #0E4B43; --hs-hero-2: #17705F;
  }
  html[data-theme="sepia"] {
    --theme-primary: #6B4A2B;
    --hs-bg: #F2E8D5;
    --hs-surface: #FBF3E3;
    --hs-text: #4A3B2A;
    --hs-muted: #8C7A63;
    --hs-primary: #6B4A2B;
    --hs-primary-contrast: #FFF8EC;
    --hs-border: #D8C7A8;
    --hs-chip-bg: #EFE1C8;
    --hs-input-border: #C9B48F; --hs-primary-2: #8A6238; --hs-hero-1: #6B4A2B; --hs-hero-2: #8A6238;
  }
  html[data-theme="dark"] {
    --theme-primary: #2E7D6F;
    --hs-bg: #10151A;
    --hs-surface: #1B232B;
    --hs-text: #E8EEF0;
    --hs-muted: #7C8B93;
    --hs-primary: #2E7D6F;
    --hs-primary-contrast: #FFFFFF;
    --hs-border: #2C363F;
    --hs-chip-bg: #22303A;
    --hs-input-border: #3A4852; --hs-primary-2: #3A9484; --hs-hero-1: #2E7D6F; --hs-hero-2: #3A9484;
  }

  /* Health & Habit রঙের থিম — শুধু টোকেন; নতুন থিম যোগ = একটা ব্লক। (Light/Sepia/Dark-এর পরে যাতে সমান specificity-তে জেতে) */
  html[data-theme="herbal"] {
    color-scheme: light;
    --theme-primary: #14532D;
    --hs-bg: #E6EEDE; --hs-surface: #FBF8EA; --hs-text: #163422; --hs-muted: #546856;
    --hs-primary: #14532D; --hs-primary-contrast: #FFFFFF; --hs-border: #CFDCC6; --hs-chip-bg: #EEF0DE;
    --hs-input-border: #B5C7AC; --hs-primary-2: #1F7A44; --hs-hero-1: #14532D; --hs-hero-2: #1F7A44;
  }
  html[data-theme="night-pulse"] {
    color-scheme: dark;
    --theme-primary: #1A8F60;
    --hs-bg: #05080A; --hs-surface: #11181A; --hs-text: #ECF4F0; --hs-muted: #8FA39B;
    --hs-primary: #1A8F60; --hs-primary-contrast: #FFFFFF; --hs-border: #2A3A3D; --hs-chip-bg: #1C2628;
    --hs-input-border: #3A4F52; --hs-primary-2: #22A872; --hs-hero-1: #0F6B47; --hs-hero-2: #1A8F60;
  }
  html[data-theme="calm-paper"] {
    color-scheme: light;
    --theme-primary: #185E6A;
    --hs-bg: #ECE0C2; --hs-surface: #FDF8E9; --hs-text: #2C2418; --hs-muted: #68583E;
    --hs-primary: #185E6A; --hs-primary-contrast: #FFFFFF; --hs-border: #D9C9A0; --hs-chip-bg: #F3E8CD;
    --hs-input-border: #C4B286; --hs-primary-2: #237A8A; --hs-hero-1: #185E6A; --hs-hero-2: #237A8A;
  }
  html[data-theme="warm-clay"] {
    color-scheme: light;
    --theme-primary: #AA4826;
    --hs-bg: #F8EFE6; --hs-surface: #FFFAF5; --hs-text: #3A2218; --hs-muted: #7A5444;
    --hs-primary: #AA4826; --hs-primary-contrast: #FFFFFF; --hs-border: #E8CDBB; --hs-chip-bg: #F6DCCB;
    --hs-input-border: #D9B8A2; --hs-primary-2: #C45A33; --hs-hero-1: #AA4826; --hs-hero-2: #C45A33;
  }
  html[data-theme="ocean-calm"] {
    color-scheme: light;
    --theme-primary: #3E6092;
    --hs-bg: #E2E7F2; --hs-surface: #F7F9FC; --hs-text: #222A3C; --hs-muted: #546078;
    --hs-primary: #3E6092; --hs-primary-contrast: #FFFFFF; --hs-border: #C9D2E4; --hs-chip-bg: #E8EDF6;
    --hs-input-border: #AEBAD2; --hs-primary-2: #5078AE; --hs-hero-1: #3E6092; --hs-hero-2: #5078AE;
  }
  html, body { background: var(--hs-bg); margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
  html, body { color: var(--hs-text); -webkit-font-smoothing: antialiased; }

  /* ডিজাইন-পলিশ: ফর্ম-ঘর, বোতাম ও ফোকাস — বয়স্কদের জন্য বড় ছোঁয়ার জায়গা (≥44px), স্পষ্ট বর্ডার */
  input, select, textarea {
    font-family: inherit; font-size: 14px !important; min-height: 46px; box-sizing: border-box;
    border: 1.5px solid var(--hs-input-border, #C3D2CA) !important; border-radius: 12px !important; padding: 10px 12px !important;
    background: var(--hs-surface, #fff); color: var(--hs-text, #1B2430); transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 96px; line-height: 1.5; }
  input[type="checkbox"], input[type="radio"] { min-height: 0; width: 22px; height: 22px; padding: 0 !important; accent-color: var(--hs-primary, #0E4B43); flex-shrink: 0; }
  input[type="file"] { min-height: 0; padding: 8px !important; background: var(--hs-bg, #F7FAF8); }
  input[type="file"]::file-selector-button {
    font-family: inherit; font-size: 14px; font-weight: 600; margin-right: 10px; padding: 8px 14px;
    border: none; border-radius: 999px; background: var(--hs-primary, #0E4B43); color: var(--hs-primary-contrast, #fff); cursor: pointer;
  }
  select.hs-compact { min-height: 36px; padding: 4px 8px !important; border-radius: 10px !important; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--hs-primary, #0E4B43) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--hs-primary, #0E4B43) 22%, transparent); }
  input::placeholder, textarea::placeholder { color: #8A9A96; }
  button { font-family: inherit; min-height: 44px; -webkit-tap-highlight-color: transparent; transition: transform .08s, box-shadow .15s, background .15s; }
  button[style*="background: none"] { min-height: 32px; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .65; }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--hs-primary, #0E4B43) 45%, transparent); outline-offset: 2px; }
  @keyframes hsFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hs-page { animation: hsFade .25s ease; }
  /* "যোগ করুন"-জাতীয় বাটনের আলাদা accent রং — প্রতি থিমে primary থেকে ভিন্ন (টোকেন; নতুন থিমে না দিলে :root-এর ডিফল্ট) */
  :root { --hs-accent: #B45309; --hs-accent-2: #D2691E; }
  html[data-theme="sepia"], html[data-theme="warm-clay"] { --hs-accent: #2F6F73; --hs-accent-2: #3E8A8F; }
  html[data-theme="dark"], html[data-theme="night-pulse"] { --hs-accent: #B8651B; --hs-accent-2: #D07A2A; --hs-sand: #2B2A22; --hs-sand-border: #4A4634; --hs-blue-soft: #243546; --hs-track: #2C3A38; }
  html[data-theme="herbal"] { --hs-accent: #A16207; --hs-accent-2: #C58A1B; }
  /* অনুভূমিক স্ক্রল-সারির নিচের স্ক্রলবার-দাগ লুকাতে (স্ক্রল কাজ করে) */
  .hs-noscroll { scrollbar-width: none; -ms-overflow-style: none; }
  .hs-noscroll::-webkit-scrollbar { display: none; }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
</style>

</head>
<body>
<div id="root"><div class="hc-splash"><img src="/icons/icon-192.png" alt="" /><b>Health Companion</b><div class="hc-spin"></div></div></div>

<script type="module" src="/src/main.jsx"></script>
</body>
</html>
