name: delete-general-chat-data

# General Chat-এর সব Firestore ডাটা মোছা — পিসি ছাড়াই (owner-অনুমোদিত, ২০২৬-১১-১১)।
# Actions → delete-general-chat-data → Run workflow।
#  ১) প্রথমে mode = dry-run (কিছু মোছে না, শুধু গোনে) — লগে সংখ্যা দেখুন।
#  ২) ঠিক থাকলে mode = delete এবং confirm ঘরে DELETE লিখুন।
# মোছার আগে সব ডাটা JSON-ব্যাকআপে লেখা হয় এবং run-পাতার নিচে "Artifacts"-এ ৭ দিন থাকে — আগে ডাউনলোড করে রাখুন।
# ⚠ ব্যাকআপে ব্যক্তিগত চ্যাট আছে; ডাউনলোডের পর artifact নিজে মুছে দিতে পারেন।
# মোছা হয় শুধু generalChat* collection। স্বাস্থ্য-রেকর্ড/AI চ্যাট/অন্য কিছু ছোঁয়া হয় না।
# Cloudinary ছবি এটা মোছে না (আলাদা, হাতে)। Secret: FIREBASE_SERVICE_ACCOUNT (deploy-rules-এর একই)।
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (শুধু গোনা) অথবা delete (আসল মোছা)'
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - delete
      confirm:
        description: 'delete হলে DELETE লিখুন (dry-run-এ ফাঁকা রাখুন)'
        required: false

permissions:
  contents: read

jobs:
  cleanup:
    if: ${{ inputs.mode == 'dry-run' || inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Service account
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Dry-run (কিছু মোছা হবে না)
        if: ${{ inputs.mode == 'dry-run' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/deleteGeneralChatData.js
      - name: Delete (ব্যাকআপ লিখে তারপর মোছা)
        if: ${{ inputs.mode == 'delete' && inputs.confirm == 'DELETE' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/deleteGeneralChatData.js --confirm
      - name: ব্যাকআপ সংরক্ষণ (Artifacts, ৭ দিন)
        if: ${{ always() && inputs.mode == 'delete' && inputs.confirm == 'DELETE' }}
        uses: actions/upload-artifact@v4
        with:
          name: general-chat-backup
          path: scripts/general-chat-backup-*.json
          retention-days: 7
          if-no-files-found: ignore
