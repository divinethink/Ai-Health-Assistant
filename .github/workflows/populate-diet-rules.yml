name: populate-diet-rules

# খাদ্য নির্দেশিকা (dietGuidanceRules) Firestore-এ আপডেট — পিসি ছাড়াই।
# Actions → populate-diet-rules → Run workflow।
#  ১) dry-run: কিছু লেখে না, শুধু তালিকা-আপডেটের preview।
#  ২) sync-lists + confirm ঘরে SYNC: বিদ্যমান ডকের শুধু খাবার/অভ্যাস-তালিকা বদলায়; status (verified) অক্ষত।
#  ৩) create-missing: যে ডক Firestore-এ নেই (যেমন BMI-র ৩টি) শুধু সেগুলো draft হিসেবে বানায়।
#     confirm ফাঁকা = শুধু preview; আসল লেখতে confirm ঘরে CREATE লিখুন। বিদ্যমান ডক overwrite হয় না।
# Secret: FIREBASE_SERVICE_ACCOUNT (deploy-rules-এর একই secret)।
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run, sync-lists অথবা create-missing'
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - sync-lists
          - create-missing
      confirm:
        description: 'sync-lists হলে SYNC, create-missing-এর আসল লেখায় CREATE (preview-তে ফাঁকা)'
        required: false

permissions:
  contents: read

jobs:
  populate:
    if: ${{ inputs.mode == 'dry-run' || inputs.mode == 'create-missing' || inputs.confirm == 'SYNC' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Service account
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Dry-run (কিছু লেখা হবে না)
        if: ${{ inputs.mode == 'dry-run' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/populateDietGuidanceRules.js --sync-lists
      - name: Sync lists (আসল write)
        if: ${{ inputs.mode == 'sync-lists' && inputs.confirm == 'SYNC' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/populateDietGuidanceRules.js --confirm --sync-lists
      - name: Create missing (preview, কিছু লেখা হবে না)
        if: ${{ inputs.mode == 'create-missing' && inputs.confirm != 'CREATE' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/populateDietGuidanceRules.js
      - name: Create missing (আসল write — শুধু না-থাকা ডক)
        if: ${{ inputs.mode == 'create-missing' && inputs.confirm == 'CREATE' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/populateDietGuidanceRules.js --confirm
