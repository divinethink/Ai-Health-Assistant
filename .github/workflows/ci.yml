name: ci

# কোড ভাঙলে সাথে সাথে ধরা পড়ে: lint + build + Firestore rules test।
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json repo-তে থাকলে npm ci, না থাকলে npm install
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      # lint ফেল করলে CI ফেল (আগে continue-on-error ছিল; এখন ০ error যাচাই হয়েছে)
      - run: npm run lint
      - run: npm run build
      # pure-logic test (হিসাব/পার্সিং/নিয়ম) — package.json বদলানো ছাড়াই
      - run: node --test tests/tracker/*.test.mjs tests/shared/*.test.mjs tests/doctor/*.test.mjs

  # Firestore Rules emulator test। আলাদা job — ব্যর্থ হলে build/lint ফল ঢাকা পড়ে না।
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm run test:rules
