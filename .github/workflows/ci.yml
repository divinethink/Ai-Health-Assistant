name: ci
on:
  push:
    paths-ignore: ['*.zip']
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Java: Firestore emulator (test:rules) এর জন্য
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # package-lock.json repo-তে নেই বলে npm ci নয়
      - run: npm install --no-audit --no-fund
      - run: npm run test:rules
      - run: npm run build
