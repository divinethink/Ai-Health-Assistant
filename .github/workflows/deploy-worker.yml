name: deploy-worker

# Cloudflare Worker (worker/) হাতে-চালানো deploy: Actions → deploy-worker → Run workflow।
# ভুলে ট্যাপ ঠেকাতে confirm ঘরে DEPLOY লিখতে হয়।
#
# লাগবে (Settings → Secrets and variables → Actions):
#   Secrets (আগের deploy.yml-এর মতোই): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#     ⚠ টোকেনে "Workers Scripts: Edit" অনুমতি লাগবে (শুধু Pages অনুমতি থাকলে Worker deploy ব্যর্থ হবে)।
#   Variables (গোপন নয়): FIREBASE_PROJECT_ID, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY
#     ঐচ্ছিক Variables: ALLOWED_ORIGIN (না দিলে *), MISTRAL_MODEL, CEREBRAS_MODEL, OPENROUTER_MODEL,
#                        GENERAL_CHAT_TEXT_MODEL, GENERAL_CHAT_VISION_MODEL
#     → মানগুলো deploy-এর সময় --var দিয়ে বসে, তাই wrangler.toml-এর REPLACE_WITH_… placeholder কখনো live হয় না।
#   ঐচ্ছিক Secrets (থাকলে Worker-এ সেট হয়; না থাকলে Worker-এর বিদ্যমান secret অপরিবর্তিত):
#     WORKER_CLOUDINARY_API_SECRET, WORKER_GROQ_API_KEY, WORKER_MISTRAL_API_KEY,
#     WORKER_CEREBRAS_API_KEY, WORKER_OPENROUTER_API_KEY, WORKER_EXA_API_KEY
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'নিশ্চিত করতে DEPLOY লিখুন'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  worker:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ vars.CLOUDINARY_API_KEY }}
      ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      GENERAL_CHAT_TEXT_MODEL: ${{ vars.GENERAL_CHAT_TEXT_MODEL }}
      GENERAL_CHAT_VISION_MODEL: ${{ vars.GENERAL_CHAT_VISION_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Config check
        # খালি মান থাকলে ভাঙা Worker live হওয়ার আগেই থামে
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIREBASE_PROJECT_ID CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::খালি/অনুপস্থিত:$missing"; exit 1; fi
      - run: npm install --no-audit --no-fund
      - name: Deploy Worker
        run: |
          set -euo pipefail
          args=(--var "FIREBASE_PROJECT_ID:$FIREBASE_PROJECT_ID" --var "CLOUDINARY_CLOUD_NAME:$CLOUDINARY_CLOUD_NAME" --var "CLOUDINARY_API_KEY:$CLOUDINARY_API_KEY" --var "ALLOWED_ORIGIN:${ALLOWED_ORIGIN:-*}")
          for v in MISTRAL_MODEL CEREBRAS_MODEL OPENROUTER_MODEL GENERAL_CHAT_TEXT_MODEL GENERAL_CHAT_VISION_MODEL; do
            [ -z "${!v}" ] || args+=(--var "$v:${!v}")
          done
          npx wrangler deploy --keep-vars "${args[@]}"
      - name: Worker secrets (যেগুলো GitHub-এ দেওয়া আছে)
        env:
          S_CLOUDINARY_API_SECRET: ${{ secrets.WORKER_CLOUDINARY_API_SECRET }}
          S_GROQ_API_KEY: ${{ secrets.WORKER_GROQ_API_KEY }}
          S_MISTRAL_API_KEY: ${{ secrets.WORKER_MISTRAL_API_KEY }}
          S_CEREBRAS_API_KEY: ${{ secrets.WORKER_CEREBRAS_API_KEY }}
          S_OPENROUTER_API_KEY: ${{ secrets.WORKER_OPENROUTER_API_KEY }}
          S_EXA_API_KEY: ${{ secrets.WORKER_EXA_API_KEY }}
        run: |
          set -euo pipefail
          for n in CLOUDINARY_API_SECRET GROQ_API_KEY MISTRAL_API_KEY CEREBRAS_API_KEY OPENROUTER_API_KEY EXA_API_KEY; do
            val="S_$n"
            if [ -n "${!val}" ]; then printf '%s' "${!val}" | npx wrangler secret put "$n" > /dev/null && echo "secret set: $n"; fi
          done
