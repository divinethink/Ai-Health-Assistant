name: unzip-upload

# রেপোর ROOT-এ *.zip আপলোড (web "Upload files" → commit to main) করলে এই workflow
# zip খুলে রেপোর উপর বসায়, zip মুছে commit করে এবং CI চালু করে।
# deploy.yml (wrangler) আলাদাভাবে চালু হয়।
# Flat zip বা একটি wrapper-folder-যুক্ত zip — দুটোই চলে। zip-এর ভেতরের .github/ ইচ্ছাকৃতভাবে উপেক্ষিত
# (built-in token workflow-ফাইল বদলাতে পারে না — ওগুলো হাতে আপলোড করুন)।
# Health: CI-র পাশাপাশি deploy (Cloudflare Pages) ও চালু হয়।
# নোট: zip শুধু ফাইল যোগ/overwrite করে; মুছতে হলে GitHub-এ হাতে মুছুন।
on:
  push:
    branches: [main]
    paths: ['*.zip']

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip-upload
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and commit
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "no zip at repo root"; exit 0; fi
          for z in "${zips[@]}"; do
            # ZIP-slip / symlink গার্ড: বিপজ্জনক ZIP হলে কিছুই বসানো হয় না, workflow ব্যর্থ হয়।
            # (pipefail + grep -q SIGPIPE ঝুঁকি এড়াতে আউটপুট আগে ভ্যারিয়েবলে নেওয়া হয়)
            names=$(unzip -Z1 "$z"); listing=$(unzip -Z "$z")
            if grep -qE '(^/|(^|/)\.\.(/|$)|\\)' <<<"$names"; then
              echo "::error::unsafe path in $z (absolute, '..' or backslash) — rejected"; exit 1
            fi
            if grep -qE '^l' <<<"$listing"; then
              echo "::error::symlink inside $z — rejected"; exit 1
            fi
            tmp=$(mktemp -d)
            unzip -q "$z" -d "$tmp"
            links=$(find "$tmp" -type l)
            if [ -n "$links" ]; then
              echo "::error::symlink found after extract of $z — rejected"; exit 1
            fi
            rm -rf "$tmp/__MACOSX"
            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then src="${entries[0]}"; else src="$tmp"; fi
            rm -rf "$src/.github" "$src/.git"
            cp -a "$src"/. .
            rm -rf "$tmp"
            git rm -q "$z"
          done
          git config user.name "unzip-bot"
          git config user.email "unzip-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: apply uploaded zip (${zips[*]})"
            git push origin HEAD:main
          fi

      # built-in token দিয়ে push করলে অন্য workflow নিজে চালু হয় না — তাই CI স্পষ্টভাবে চালু।
      - name: Trigger CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main

      # একই কারণে deploy-ও স্পষ্টভাবে চালু; concurrency (group: deploy) বলে একসাথে দুটো চলে না
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
