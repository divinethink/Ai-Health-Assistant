name = "health-assistant-media-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# প্লেইন config (secret না) — deploy করার আগে নিজের মান বসান।
[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_YOUR_FIREBASE_PROJECT_ID"
CLOUDINARY_CLOUD_NAME = "REPLACE_WITH_YOUR_CLOUDINARY_CLOUD_NAME"
CLOUDINARY_API_KEY = "REPLACE_WITH_YOUR_CLOUDINARY_API_KEY"
ALLOWED_ORIGIN = "*"

# SECRET — plaintext টাইপ করবেন না এখানে। Deploy করার আগে টার্মিনালে চালান:
#   wrangler secret put CLOUDINARY_API_SECRET
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put MISTRAL_API_KEY
#   (Architecture Plan Part B §6.5 Phase 2 — Mistral secondary/failover। এই
#   secret set না করলে আগের মতোই শুধু Groq active থাকবে, কোনো ভাঙা পরিবর্তন না।
#   Mistral La Plateforme-এ signup করে free "Experiment" tier API key নিন।
#   ঐচ্ছিক: model বদলাতে চাইলে [vars]-এ MISTRAL_MODEL = "mistral-small-latest"
#   (বা অন্য কোনো Mistral model) যোগ করা যায়, না দিলে ডিফল্ট mistral-small-latest।)
